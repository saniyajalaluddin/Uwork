# This workflow triggers Datadog Synthetic tests within your Datadog organisation.
# For more information see: https://docs.datadoghq.com/synthetics/cicd_integrations/github_actions/

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Datadog Credentials
        id: check_keys
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY || secrets.DATADOG_APP_KEY }}
        run: |
          if [ -n "$DD_API_KEY" ] && [ -n "$DD_APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Datadog credentials verified."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Datadog API or APP key is missing from repository secrets (DD_API_KEY / DD_APP_KEY). Skipping synthetic tests."
          fi

      - name: Run Datadog Synthetic tests
        if: steps.check_keys.outputs.configured == 'true'
        uses: DataDog/synthetics-ci-github-action@v4.1.1
        with:
          api-key: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY }}
          app-key: ${{ secrets.DD_APP_KEY || secrets.DATADOG_APP_KEY }}
          datadog-site: ${{ secrets.DD_SITE || secrets.DATADOG_SITE || 'datadoghq.com' }}
          test-search-query: 'tag:e2e-tests'
        env:
          DATADOG_API_KEY: ${{ secrets.DD_API_KEY || secrets.DATADOG_API_KEY }}
          DATADOG_APP_KEY: ${{ secrets.DD_APP_KEY || secrets.DATADOG_APP_KEY }}
          DATADOG_SITE: ${{ secrets.DD_SITE || secrets.DATADOG_SITE || 'datadoghq.com' }}
