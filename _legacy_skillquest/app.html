<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SkillQuest</title><link rel="stylesheet" href="quest.css"><style>.auth{min-height:100vh;display:grid;grid-template-columns:1fr 390px;gap:60px;place-items:center;max-width:1000px;margin:auto;padding:30px}.auth section{color:var(--ink)}.auth form{background:var(--card);border:1px solid var(--line);padding:28px;border-radius:16px;width:100%;box-shadow:var(--shadow)}.auth input{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}.auth form button,.auth form a{display:block;width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--purple);color:#fff;text-align:center;cursor:pointer}.auth form a{background:none;color:var(--purple);font-size:12px}.auth #autherror{color:#dc5575;font-size:12px;min-height:16px}@media(max-width:700px){.auth{grid-template-columns:1fr;padding:24px}.auth h1{font-size:42px}}</style></head><body><div id="auth" class="auth"><section><b>✦ SkillQuest</b><h1>Make learning<br><em>feel electric.</em></h1><p>Practice tough concepts and build an honest skill record.</p></section><form id="form"><h2 id="formtitle">Welcome back</h2><input id="name" placeholder="Your name" hidden><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (8+ characters)" required><button>Sign in</button><p id="error"></p><a id="switch">New here? Create an account</a></form></div><div id="app" hidden><aside><b>✦ SkillQuest</b><small>CODE • THINK • EARN</small><nav><a data-tab="home" class="active">⌂ Home</a><a data-tab="learn">⌘ Learn paths</a><a data-tab="challenge">⚡ Challenges</a><a data-tab="arcade">◉ Quest arcade</a><a data-tab="progress">↗ Progress</a><a data-tab="account">⚙ Account</a></nav><button id="theme">☼ Light mode</button><p class="user">SQ <span id="username"></span></p></aside><main><header><div><label id="tablabel">YOUR DASHBOARD</label><h1>Welcome back.<br><em>Keep going.</em></h1></div><div class="wallet"><label>VERIFIED SQ</label><strong id="points">0.00</strong><small>100 SQ = ₹1.00</small></div></header><section id="content"></section></main></div><div id="toast"></div><script src="app.js"></script></body></html>
